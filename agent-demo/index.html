<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tandem — Agent Demo (live)</title>
<link rel="stylesheet" href="/shared/tokens.css">
<style>
  /* Agent-demo-only styles. Everything shared lives in /shared/tokens.css. */
  .live-dot{width:8px;height:8px;border-radius:50%;background:var(--green-solid);display:inline-block;margin-right:5px;animation:blink 1.6s infinite}
  .rollback-btn{margin-top:6px;font-size:11px;border:1px solid var(--line);background:var(--card);border-radius:6px;padding:4px 9px;cursor:pointer;color:var(--ink-2);font-family:inherit}
</style>
</head>
<body>

<a class="skip-link" href="#main" id="skipLink">Skip to the conversation</a>

<header>
  <div class="logo" aria-hidden="true">T</div>
  <div>
    <h1>Tandem <span style="font-weight:400;color:var(--ink-2)">· agent demo <span class="live-dot" aria-hidden="true"></span>live</span></h1>
    <p class="sub" id="headerSub"></p>
  </div>
  <nav class="tabs" aria-label="Demo sections">
    <div role="tablist" aria-label="Demo sections">
      <button type="button" role="tab" id="tab-demo" data-view="demo" aria-controls="view-demo" aria-selected="true" tabindex="0" class="active">Chat</button>
      <button type="button" role="tab" id="tab-metrics" data-view="metrics" aria-controls="view-metrics" aria-selected="false" tabindex="-1">Metrics <span class="badge" id="mBadge" hidden>new activity</span></button>
    </div>
    <a href="http://localhost:8321/lifecycle-demo/" id="lifecycleLink">Lifecycle demo <span aria-hidden="true">↗</span><span class="sr-only">(opens demo #1 — the scripted lifecycle showcase)</span></a>
  </nav>
  <ul class="state-pill" id="statePill" aria-label="Conversation state"></ul>
  <button type="button" class="toggle-btn" id="debugToggle" aria-pressed="false"><span aria-hidden="true">🔍</span> Presenter mode</button>
</header>

<main id="main" tabindex="-1">

<div class="view active" id="view-demo" role="tabpanel" aria-labelledby="tab-demo">
<div class="layout">
  <div class="chat-col">
    <ol id="chat" aria-label="Conversation with the coach"></ol>
    <div class="composer">
      <div class="chips" id="chips" role="group" aria-label="Suggested replies"></div>
      <form class="inputrow" id="composerForm">
        <label class="sr-only" for="freeInput">Message the coach</label>
        <input id="freeInput" name="message" autocomplete="off" aria-describedby="disclaim"
               placeholder="Ask the coach anything — it's a live model with real tools…">
        <button type="submit" id="sendBtn">Send</button>
      </form>
      <p class="disclaim" id="disclaim"></p>
    </div>
  </div>

  <aside aria-labelledby="memTitle">
    <h2 id="memTitle" tabindex="-1"></h2>
    <p class="memnote" id="memNote"></p>
    <ul id="memories"></ul>
  </aside>
</div>
</div>

<div class="view" id="view-metrics" role="tabpanel" aria-labelledby="tab-metrics" tabindex="0">
  <div class="metrics-wrap" id="metricsWrap"></div>
</div>

</main>

<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>

<script type="module">
import { STATES, PILL_ORDER, INITIAL_STATE } from '/shared/states.js';
import { PANEL_COPY, CONSENT_COPY } from '/shared/memory.js';
import { AUTONOMY } from '/shared/guardrails.js';
import { renderMetricsView, FEEDBACK_COPY } from '/shared/telemetry.js';
import { loadPersona } from '/shared/persona.js';
import {
  A11Y_COPY, createStatusRegion, createStreamAnnouncer, initTabs, initSkipLink,
  toggleDisclosure, openInlineMemoryEdit, createTurn, feedbackRowHtml,
  setFeedbackPressed, scrollToLatest, speechText, escAttr,
  guardrailHtml, escalateHtml, consentHtml, actionOutcomeHtml,
} from '/shared/a11y.js';

const persona = await loadPersona('/shared/persona.md');
const sessionId = 's-' + Math.random().toString(36).slice(2);

const announce = createStatusRegion();
const announcer = createStreamAnnouncer({ announce });

document.getElementById('headerSub').textContent = persona['header-sub'];
document.getElementById('disclaim').textContent = `${persona['disclaimer']} ${persona['disclaimer-agent']}`;
document.getElementById('memTitle').textContent = PANEL_COPY.title;
document.getElementById('memNote').innerHTML = PANEL_COPY.note;
document.getElementById('statePill').innerHTML =
  PILL_ORDER.map(id => `<li data-s="${id}"${id === INITIAL_STATE ? ' class="active"' : ''}>${STATES[id].label}${id === INITIAL_STATE ? ` <span class="sr-only">(${A11Y_COPY.stateCurrent})</span>` : ''}</li>`).join('');

const lifecycleLink = document.getElementById('lifecycleLink');
if (location.protocol === 'file:') lifecycleLink.href = '../lifecycle-demo/index.html';

const chat = document.getElementById('chat');
const memEl = document.getElementById('memories');
const input = document.getElementById('freeInput');
const badgeEl = document.getElementById('mBadge');

let toastT;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastT);
  toastT=setTimeout(()=>{ t.classList.remove('show'); t.textContent=''; },3400);
}

const tabs = initTabs(document.querySelector('[role="tablist"]'), view => {
  if(view==='metrics'){ badgeEl.hidden = true; renderMetrics(); }
});
initSkipLink(document.getElementById('skipLink'), 'main');

const debugToggle = document.getElementById('debugToggle');
debugToggle.addEventListener('click', ()=>{
  const on = debugToggle.getAttribute('aria-pressed') !== 'true';
  debugToggle.setAttribute('aria-pressed', String(on));
  document.body.classList.toggle('show-debug', on);
  announce(on ? A11Y_COPY.presenterOn : A11Y_COPY.presenterOff);
});
const presenterOn = () => document.body.classList.contains('show-debug');

function setState(s){
  if(!STATES[s]?.inPill) return;
  document.querySelectorAll('#statePill li').forEach(el=>{
    const on = el.dataset.s === s;
    el.classList.toggle('active', on);
    el.querySelector('.sr-only')?.remove();
    if(on){
      const mark=document.createElement('span');
      mark.className='sr-only'; mark.textContent=` (${A11Y_COPY.stateCurrent})`;
      el.appendChild(mark);
    }
  });
  announce(A11Y_COPY.stateChanged(STATES[s].label));
}
function setStatePillDegraded(){
  document.querySelectorAll('#statePill li').forEach(el=>{
    el.classList.remove('active');
    el.querySelector('.sr-only')?.remove();
  });
}

async function renderMetrics(){
  const M = await (await fetch('/api/telemetry')).json();
  document.getElementById('metricsWrap').innerHTML = renderMetricsView(M, { note: 'Counters are REAL — they live on the server and reset on server restart.' });
}
function badge(){ badgeEl.hidden = false; }

/* ---------------- memory panel (live, server-backed) ---------------- */
async function renderMemories(){
  const { memories } = await (await fetch('/api/memory')).json();
  memEl.innerHTML = memories.map(m => `
    <li class="mem${m.status==='pending-consent'?' pendingc':''}" data-id="${m.id}">
      <span class="tag ${m.type}">${m.type.toUpperCase()}</span><p class="mtext"></p>
      <p class="decay">↓ decays: ${m.decay}</p>
      ${m.status==='pending-consent'?`<p class="pending">${PANEL_COPY.pendingConsent}</p>`:''}
      <div class="controls">
        <button type="button" data-mem="edit">edit</button>
        <button type="button" data-mem="delete">delete</button>
      </div>
    </li>`).join('');
  memories.forEach(m => {
    const card = memEl.querySelector(`.mem[data-id="${m.id}"]`);
    card.querySelector('.mtext').textContent = m.text;
    labelMemoryControls(card);
  });
}

/** Controls must name the memory they act on, not just the verb. */
function labelMemoryControls(card){
  const text = card.querySelector('.mtext').textContent;
  card.querySelector('[data-mem="edit"]')?.setAttribute('aria-label', A11Y_COPY.memEdit(text));
  card.querySelector('[data-mem="delete"]')?.setAttribute('aria-label', A11Y_COPY.memDelete(text));
}

memEl.addEventListener('click', async e=>{
  const b=e.target.closest('button[data-mem]'); if(!b) return;
  const card=b.closest('.mem');
  const id=+card.dataset.id;

  if(b.dataset.mem==='delete'){
    // The list re-renders, so the focused button is about to vanish. Park focus
    // on whatever takes its place, or on the panel heading if the list empties.
    const index=[...memEl.children].indexOf(card);
    await fetch('/api/memory/delete',{method:'POST',body:JSON.stringify({id})});
    toast(PANEL_COPY.deleteToast); badge();
    await renderMemories();
    const next=memEl.children[index] || memEl.children[index-1];
    (next?.querySelector('[data-mem="delete"]') || document.getElementById('memTitle')).focus();
    return;
  }

  // Inline, in-place edit — prompt() is prohibited: unstyleable, blocking,
  // and hostile to screen readers.
  openInlineMemoryEdit({
    card, trigger:b, value: card.querySelector('.mtext').textContent, announce,
    onSave: async next => {
      await fetch('/api/memory/edit',{method:'POST',body:JSON.stringify({id,text:next})});
      card.querySelector('.mtext').textContent = next;
      labelMemoryControls(card);
    },
  });
});
renderMemories();

/* ---------------- chat ---------------- */
function userMsg(text){
  const li=createTurn('user');
  li.innerHTML+='<div class="bubble"></div>';
  li.querySelector('.bubble').textContent=text;
  chat.appendChild(li); scrollToLatest(chat);
}

// local first message — same persona.md copy the system prompt compiles from
{
  const li=createTurn('coach');
  li.insertAdjacentHTML('beforeend', `<div class="bubble">${persona['greeting']}<br><br>Before we start: ${persona['limitations']} You'll find that memory in the panel on the right.</div>
    <div class="debug"><span class="k">boot:</span> greeting rendered from shared/persona.md — the same blocks compiled into the live system prompt (agent/system-prompt.js)</div>`);
  chat.appendChild(li);
}

let busy=false;
async function sendMsg(text){
  if(!text||busy) return;
  busy=true;
  const sendBtn=document.getElementById('sendBtn');
  sendBtn.disabled=true;
  userMsg(text);

  const li=createTurn('coach');
  li.insertAdjacentHTML('beforeend',
    `<div class="bubble typing"><span class="sr-only">${A11Y_COPY.thinking}</span><i aria-hidden="true"></i><i aria-hidden="true"></i><i aria-hidden="true"></i></div>`);
  chat.appendChild(li); scrollToLatest(chat);
  // Real model latency is seconds, so the wait is worth announcing. (The
  // scripted demo's 900ms pause is not — it would be pure noise there.)
  announce(A11Y_COPY.thinking);

  let raw=''; const debugLines=[]; const extras=[]; let degraded=false; let turnMeta=null;
  let streaming=false;
  const turnId=Date.now().toString(36);
  const bubble=()=>li.querySelector('.bubble');

  const render=()=>{ // live render, [src:x] markers hidden until turn_done resolves them
    bubble().classList.remove('typing');
    bubble().innerHTML = raw.replace(/\[src:[\w-]+\]/g,'');
    scrollToLatest(chat);
  };

  const res=await fetch('/api/chat',{method:'POST',body:JSON.stringify({sessionId,message:text})});
  const reader=res.body.getReader(); const dec=new TextDecoder(); let buf='';
  while(true){
    const {done,value}=await reader.read(); if(done) break;
    buf+=dec.decode(value,{stream:true});
    const parts=buf.split('\n\n'); buf=parts.pop();
    for(const part of parts){
      const line=part.split('\n').find(l=>l.startsWith('data:')); if(!line) continue;
      handleEvent(JSON.parse(line.slice(5)));
    }
  }

  function handleEvent(ev){
    if(ev.type==='delta'){
      if(!streaming){
        streaming=true;
        // Hand the turn to the announcer: it buffers tokens and speaks only on
        // clause boundaries. A raw token stream makes VoiceOver stutter.
        announcer.begin(li);
      }
      raw+=ev.text; render(); announcer.push(ev.text);
    }
    else if(ev.type==='tool'){
      debugLines.push(`<span class="k">tool:</span> ${ev.name}(${JSON.stringify(ev.input).slice(0,90)})`);
      if(presenterOn()) announce(`Tool call: ${ev.name}.`);
    }
    else if(ev.type==='state'){ setState(ev.to); debugLines.push(`<span class="k">state:</span> ${ev.to}`); }
    else if(ev.type==='guardrail'){
      extras.push(guardrailHtml(ev.banner));
      debugLines.push(`<span class="k">guardrail:</span> ${ev.id} · <span class="k">eval label:</span> ${ev.evalLabel}`); badge();
    }
    else if(ev.type==='escalation_offer'){
      extras.push(escalateHtml(ev.copy, ev.button));
      debugLines.push(`<span class="k">escalation triggers:</span> ${ev.triggers.join(', ')} (server-detected — banner shown regardless of model)`);
    }
    else if(ev.type==='proposal'){
      const p=ev.proposal;
      extras.push(`<div class="action-card" data-proposal="${p.id}" role="group" aria-labelledby="ac-head-${p.id}">
        <div class="ac-head" id="ac-head-${p.id}">${AUTONOMY.actionCardHead}</div>
        <div class="ac-body">
          <div class="ac-row"><span>Change</span><b>401(k) contribution: ${p.prevValue}% → ${p.newValue}%</b></div>
          <div class="ac-row"><span>Per paycheck</span><b>≈ $${p.perPaycheck} more</b></div>
          <div class="ac-row"><span>Effective</span><b>Next pay period · reversible anytime</b></div>
        </div>
        <div class="ac-btns">
          <button type="button" class="primary" data-x="approve">Approve change</button>
          <button type="button" data-x="decline">Not now</button>
        </div>
        <div class="ac-note">${AUTONOMY.actionCardNote}</div>
      </div>`);
      debugLines.push(`<span class="k">write gated:</span> plan_change_draft → proposal #${p.id} · executes ONLY via /api/confirm (user event) · rollback defined ✓`);
      badge();
    }
    else if(ev.type==='consent_request'){
      extras.push(consentHtml({
        id: ev.memory.id,
        ask: CONSENT_COPY.ask(`"${ev.memory.text}" <i>(${ev.memory.type})</i>`),
        yes: CONSENT_COPY.yesButton, no: CONSENT_COPY.noButton,
      }));
      debugLines.push(`<span class="k">memory:</span> ${ev.memory.type} stored pending-consent — not used until granted (shared/memory.js enforced in memory-store.js)`);
      renderMemories();
    }
    else if(ev.type==='memory_written'){ renderMemories(); badge(); }
    else if(ev.type==='degraded'){
      degraded=true; raw=ev.html; li.classList.add('degraded');
      if(!streaming){ streaming=true; announcer.begin(li); }
      render(); announcer.push(speechText(ev.html) + ' ');
      setStatePillDegraded();
      debugLines.push(`<span class="k">state:</span> degraded · honest disabled state — never improvisation${ev.detail?` · <span class="k">cause:</span> ${ev.detail}`:''}`); badge();
    }
    else if(ev.type==='turn_done'){ turnMeta=ev; finalize(); }
  }

  function finalize(){
    let html=raw;
    const byDoc=new Map((turnMeta?.citations||[]).map(c=>[c.docId,c]));
    let n=0;
    // A citation is a disclosure: the panel is emitted immediately after its
    // trigger so it reads in place rather than at the end of the turn.
    html=html.replace(/\[src:([\w-]+)\]/g,(_,docId)=>{
      const c=byDoc.get(docId);
      if(!c) return '';
      const pid=`cite-${turnId}-${n++}`;
      return `<button type="button" class="citation" aria-expanded="false" aria-controls="${pid}" aria-label="${escAttr(A11Y_COPY.citeShow(c.title))}">📎 ${c.docId}</button>` +
        `<div id="${pid}" class="cite-panel" role="group" aria-label="${escAttr(c.title)}"><div class="src">${c.title}</div>${c.snippet}</div>`;
    });

    if(turnMeta){
      const f=turnMeta.faithfulness;
      debugLines.push(`<span class="k">faithfulness:</span> ${f.ok}/${f.total} numeric claims grounded${f.total?` (${(f.ok/f.total).toFixed(2)})`:''}${f.misses.length?` · <span class="k">misses:</span> ${f.misses.map(m=>m.number).join(', ')}`:''}`);
    }

    li.replaceChildren();
    li.insertAdjacentHTML('beforeend',
      `<span class="sr-only">${A11Y_COPY.speakerCoach}</span>
       <div class="bubble">${html}${extras.join('')}</div>
       ${debugLines.length?`<div class="debug">${debugLines.join('<br>')}</div>`:''}
       ${degraded?'':feedbackRowHtml()}`);
    scrollToLatest(chat);
    // Turn boundary: flush the tail and let the user know the coach has settled.
    announcer.end({ note: degraded ? A11Y_COPY.turnDegraded : A11Y_COPY.turnComplete });
    busy=false; sendBtn.disabled=false; badge();
  }
  if(!turnMeta) finalize(); // stream ended without turn_done (hard failure)
}

document.getElementById('composerForm').addEventListener('submit', e=>{
  e.preventDefault();
  const text=input.value.trim();
  if(!text) return;
  input.value='';
  sendMsg(text);
});

/* in-bubble interactions */
chat.addEventListener('click', async e=>{
  const cite=e.target.closest('.citation');
  if(cite){
    const panel=document.getElementById(cite.getAttribute('aria-controls'));
    if(panel){
      const src=panel.querySelector('.src').textContent;
      const opened=toggleDisclosure(cite, panel, {
        labelOpen: A11Y_COPY.citeHide(src), labelClosed: A11Y_COPY.citeShow(src),
      });
      if(opened) fetch('/api/cite-open',{method:'POST'});
    }
    return;
  }

  const fb=e.target.closest('button[data-fb]');
  if(fb){
    const dir=+fb.dataset.fb;
    if(dir===0) return toast(FEEDBACK_COPY.regenToast);
    setFeedbackPressed(fb);
    const tail=[...chat.querySelectorAll('.bubble')].slice(-2).map(b=>b.textContent.slice(0,300));
    await fetch('/api/feedback',{method:'POST',body:JSON.stringify({dir,transcriptTail:tail})});
    toast(dir>0?FEEDBACK_COPY.upToast:FEEDBACK_COPY.downToast);
    return;
  }

  const x=e.target.closest('button[data-x]'); if(!x) return;

  if(x.dataset.x==='escalate'){
    const r=await (await fetch('/api/escalate',{method:'POST'})).json();
    toast(r.toast); badge();
  }
  else if(x.dataset.x==='approve'||x.dataset.x==='decline'){
    const card=x.closest('.action-card');
    const approve=x.dataset.x==='approve';
    const r=await (await fetch('/api/confirm',{method:'POST',body:JSON.stringify({proposalId:+card.dataset.proposal,approve})})).json();
    if(r.executed){
      card.querySelector('.ac-btns').innerHTML=
        actionOutcomeHtml(`✓ Approved — ${r.change}. Confirmation #${r.confirmationNumber}. Reversible until ${r.reversibleUntil}.`) +
        `<button type="button" class="rollback-btn" data-x="rollback" data-cn="${r.confirmationNumber}" aria-label="Roll back change, confirmation ${r.confirmationNumber}"><span aria-hidden="true">↩</span> roll back</button>`;
      announce(`Change approved. ${r.change}. Confirmation number ${r.confirmationNumber}.`);
      card.querySelector('.rollback-btn').focus();
      renderMemories(); badge();
    } else if(r.declined){
      toast(r.note);
      card.querySelector('.ac-btns').innerHTML=actionOutcomeHtml('Declined — no action taken.',{declined:true});
    }
    else toast('Refused: '+(r.error||'unknown'));
  }
  else if(x.dataset.x==='rollback'){
    const r=await (await fetch('/api/rollback',{method:'POST',body:JSON.stringify({confirmationNumber:+x.dataset.cn})})).json();
    toast(r.rolledBack?('Rolled back — '+r.restored):('Rollback failed: '+r.error));
  }
  else if(x.dataset.x==='consent-yes'||x.dataset.x==='consent-no'){
    const box=x.closest('.consent');
    const grant=x.dataset.x==='consent-yes';
    await fetch('/api/memory/consent',{method:'POST',body:JSON.stringify({id:+box.dataset.consentId,grant})});
    box.innerHTML=grant?CONSENT_COPY.granted:CONSENT_COPY.declined;
    announce(speechText(box.innerHTML));
    input.focus();
    renderMemories(); badge();
  }
});

/* suggested starters mirror the scripted journey */
const starters=[
  'Am I on track for retirement?',
  'What stock should I buy? 📈',
  "Honestly I'm freaking out — should I sell everything?",
  "Let's work on my emergency fund",
];
const chipsEl=document.getElementById('chips');
starters.forEach(s=>{
  const b=document.createElement('button');
  b.type='button'; b.className='chip'; b.textContent=s;
  b.addEventListener('click', ()=>{ input.value=''; sendMsg(s); });
  chipsEl.appendChild(b);
});
</script>
</body>
</html>
